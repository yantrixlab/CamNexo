name: CI

on:
  push:
    branches: [main, 'linux-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: core

  flutter:
    name: Flutter ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/${{ matrix.app }}
      - run: flutter analyze
        working-directory: apps/${{ matrix.app }}
      - run: flutter test
        working-directory: apps/${{ matrix.app }}

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: camnexo-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build native helpers (receiver, virtual camera)
        shell: pwsh
        run: |
          cmake -S native/windows/vcam -B native/windows/vcam/build -A x64
          cmake --build native/windows/vcam/build --config Release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        working-directory: installer/windows
        run: ./build.ps1 -Version "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: camnexo-windows-installer
          path: installer/windows/output/*.exe

  linux-receiver:
    name: Linux receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libavcodec-dev libavutil-dev libavahi-client-dev
      - name: Build the receiver
        run: |
          chmod +x tools/ci-run.sh
          tools/ci-run.sh "Configure" cmake -S native/linux -B native/linux/build -DCMAKE_BUILD_TYPE=Release
          tools/ci-run.sh "Build the receiver" cmake --build native/linux/build -j 4
      - name: Run with test cameras
        run: |
          cd native/linux/build
          timeout 8 ./camnexo_receiver --simulate 2 --no-discovery --no-v4l2 --port 7999 \
            --snap /tmp/snap.bmp --preview-socket /tmp/camnexo-ci.sock > /tmp/receiver.log || true
          cat /tmp/receiver.log
          for want in "connected from simulated" "cap sizes=" "rx 30 fps in" "background effects unavailable (not installed)"; do
            grep -q "$want" /tmp/receiver.log || { echo "::error title=Receiver log::missing line: $want"; exit 1; }
          done
          test -s /tmp/snap.bmp || { echo "::error title=Receiver::no picture was composed"; exit 1; }
          ls -l /tmp/snap.bmp
      - name: Effects (real model, from the downloadable pack)
        run: |
          native/linux/make-effects-pack.sh
          mkdir -p "$HOME/.local/share/camnexo/effects"
          tar -xzf native/linux/dist/CamNexo-Effects-linux-x64-1.tar.gz -C "$HOME/.local/share/camnexo/effects"
          img="$PWD/brand/camnexo-logo.png"
          cd native/linux/build
          ./camnexo_receiver --fx-test "$img" /tmp/fx.bmp 1 | tee /tmp/fx.log
          grep -q "background effects ready" /tmp/fx.log || { echo "::error title=Effects::the model did not load: $(grep '\[fx\]' /tmp/fx.log)"; exit 1; }
          grep -q "^wrote " /tmp/fx.log || { echo "::error title=Effects::no picture was written"; exit 1; }
      - name: Virtual camera (v4l2loopback), end to end
        continue-on-error: true
        run: |
          chmod +x tools/ci-v4l2-test.sh
          tools/ci-run.sh "Virtual camera" tools/ci-v4l2-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: camnexo-linux-receiver
          path: native/linux/build/camnexo_receiver

  linux-desktop:
    name: Linux desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Build the app
        working-directory: apps/desktop
        run: |
          chmod +x ../../tools/ci-run.sh
          ../../tools/ci-run.sh "flutter build linux" flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: camnexo-linux-desktop-bundle
          path: apps/desktop/build/linux/x64/release/bundle

  linux-package:
    name: Linux package (.deb)
    runs-on: ubuntu-22.04   # the oldest supported system: the package then also runs on newer ones
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang pkg-config nasm xz-utils \
            libgtk-3-dev liblzma-dev libavahi-client-dev xvfb
      - uses: actions/cache@v4
        with:
          path: native/linux/third_party/ffmpeg/install
          key: ffmpeg-lgpl-h264-${{ hashFiles('native/linux/build-ffmpeg.sh') }}-22.04
      - name: Build the small LGPL FFmpeg
        run: |
          chmod +x tools/ci-run.sh native/linux/build-ffmpeg.sh installer/linux/build-deb.sh
          tools/ci-run.sh "FFmpeg" native/linux/build-ffmpeg.sh
      - name: Build the receiver (with the bundled FFmpeg)
        run: |
          export PKG_CONFIG_PATH="$PWD/native/linux/third_party/ffmpeg/install/lib/pkgconfig"
          tools/ci-run.sh "Configure" cmake -S native/linux -B native/linux/build -DCMAKE_BUILD_TYPE=Release -DCAMNEXO_BUNDLED_LIBS=ON
          tools/ci-run.sh "Build the receiver" cmake --build native/linux/build -j 4
      - name: Build the desktop app
        working-directory: apps/desktop
        run: ../../tools/ci-run.sh "flutter build linux" flutter build linux --release
      - name: Build the package
        run: tools/ci-run.sh "build-deb" installer/linux/build-deb.sh 0.0.0-ci.${{ github.run_number }}
      - name: Install the package and check it
        run: |
          sudo apt-get install -y ./installer/linux/output/camnexo_*_amd64.deb
          ls /opt/camnexo /opt/camnexo/helpers /opt/camnexo/helpers/lib
          ldd /opt/camnexo/helpers/camnexo_receiver | grep -E "avcodec|avutil"
          ldd /opt/camnexo/helpers/camnexo_receiver | grep -E "avcodec|avutil" | grep -q "/opt/camnexo/helpers/lib" || { echo "::error title=Package::the receiver does not use the bundled FFmpeg"; exit 1; }
          ldd /opt/camnexo/camnexo_desktop | grep "not found" && { echo "::error title=Package::missing libraries for the app"; exit 1; } || true
          dpkg -L camnexo | head -40
          test -x /usr/bin/camnexo
          desktop-file-validate /usr/share/applications/camnexo.desktop || true
      - name: Start the installed app under a virtual display
        run: |
          export HOME=/tmp/camnexo-home; mkdir -p "$HOME"
          export CAMNEXO_SIMULATE=2 LIBGL_ALWAYS_SOFTWARE=1
          (xvfb-run -a -s "-screen 0 1280x800x24" camnexo > /tmp/app.log 2>&1 &)
          sleep 15
          cat /tmp/app.log || true
          pgrep -f /opt/camnexo/helpers/camnexo_receiver > /dev/null || { echo "::error title=App::the app did not start its receiver. $(tail -c 1500 /tmp/app.log | tr '\n' ' ')"; exit 1; }
          ls -l /tmp/camnexo-*-preview.sock || { echo "::error title=App::the receiver has no preview socket"; exit 1; }
          pkill -f camnexo_desktop || true
      - uses: actions/upload-artifact@v4
        with:
          name: camnexo-deb
          path: installer/linux/output/*.deb
